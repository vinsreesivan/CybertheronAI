<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-LLM Fusion Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
            margin-bottom: 20px;
        }

        .input-section {
            margin-bottom: 20px;
        }

        .input-section label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .strategy-selector {
            flex: 1;
            min-width: 200px;
        }

        .strategy-selector select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            background: white;
            cursor: pointer;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #28a745;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-text {
            font-size: 14px;
            color: #666;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
        }

        .results.active {
            display: block;
        }

        .fused-response {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .fused-response h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .response-content {
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .metadata {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(102, 126, 234, 0.3);
            font-size: 14px;
            color: #666;
        }

        .metadata-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .individual-responses {
            margin-top: 25px;
        }

        .individual-responses h3 {
            margin-bottom: 15px;
            color: #555;
        }

        .model-response {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #e0e0e0;
        }

        .model-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #dee2e6;
        }

        .model-name {
            font-weight: 600;
            color: #764ba2;
            font-size: 1.1em;
        }

        .model-time {
            font-size: 0.9em;
            color: #666;
            background: white;
            padding: 4px 10px;
            border-radius: 5px;
        }

        .error {
            color: #dc3545;
            font-style: italic;
        }

        .success {
            color: #28a745;
        }

        .toggle-section {
            margin-top: 10px;
        }

        .toggle-btn {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-size: 14px;
            text-decoration: underline;
            padding: 5px 0;
        }

        .collapsible-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .collapsible-content.expanded {
            max-height: 2000px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .controls {
                flex-direction: column;
            }

            .strategy-selector {
                width: 100%;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Multi-LLM Fusion Interface</h1>
            <p>Query multiple AI models simultaneously and get a refined, synthesized response</p>
        </header>

        <div class="main-card">
            <div class="status-bar">
                <div class="status-indicator"></div>
                <div class="status-text" id="statusText">Ready</div>
            </div>

            <div class="input-section">
                <label for="promptInput">Enter your question or prompt:</label>
                <textarea
                    id="promptInput"
                    placeholder="Ask anything... The system will query multiple LLMs and provide a refined answer."
                ></textarea>
            </div>

            <div class="controls">
                <div class="strategy-selector">
                    <label for="strategySelect">Fusion Strategy:</label>
                    <select id="strategySelect">
                        <option value="refiner">Refiner (AI-synthesized)</option>
                        <option value="consensus">Consensus (Best match)</option>
                    </select>
                </div>
                <button class="btn-primary" id="queryBtn" onclick="submitQuery()">
                    🚀 Query All Models
                </button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Querying multiple LLMs in parallel...</p>
                <p style="font-size: 14px; color: #666; margin-top: 10px;">This may take a few moments</p>
            </div>

            <div class="results" id="results">
                <div class="fused-response">
                    <h3>✨ Refined Fusion Result</h3>
                    <div class="response-content" id="fusedResponse"></div>
                    <div class="metadata">
                        <div class="metadata-item">
                            <span>⏱️</span>
                            <span id="totalTime">-</span>
                        </div>
                        <div class="metadata-item">
                            <span>🤖</span>
                            <span id="modelsQueried">-</span>
                        </div>
                        <div class="metadata-item">
                            <span>✅</span>
                            <span id="successfulResponses">-</span>
                        </div>
                    </div>
                </div>

                <div class="individual-responses">
                    <h3>📊 Individual Model Responses</h3>
                    <div class="toggle-section">
                        <button class="toggle-btn" onclick="toggleIndividualResponses()">
                            <span id="toggleText">Show responses</span>
                        </button>
                    </div>
                    <div class="collapsible-content" id="individualResponsesContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        // Check health on load
        window.addEventListener('load', async () => {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                document.getElementById('statusText').innerHTML =
                    `<span class="success">Connected to ${data.models.length} models: ${data.models.join(', ')}</span>`;
            } catch (error) {
                document.getElementById('statusText').innerHTML =
                    `<span class="error">⚠️ Cannot connect to backend. Make sure the server is running.</span>`;
            }
        });

        async function submitQuery() {
            const prompt = document.getElementById('promptInput').value.trim();
            const strategy = document.getElementById('strategySelect').value;

            if (!prompt) {
                alert('Please enter a prompt!');
                return;
            }

            // UI state
            document.getElementById('queryBtn').disabled = true;
            document.getElementById('loading').classList.add('active');
            document.getElementById('results').classList.remove('active');

            try {
                const response = await fetch(`${API_BASE}/query`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ prompt, strategy })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                displayResults(data);

            } catch (error) {
                alert(`Error: ${error.message}\n\nMake sure Ollama is running and models are installed.`);
            } finally {
                document.getElementById('queryBtn').disabled = false;
                document.getElementById('loading').classList.remove('active');
            }
        }

        function displayResults(data) {
            // Fused response
            document.getElementById('fusedResponse').textContent = data.fused_response;
            document.getElementById('totalTime').textContent = `${data.total_time}s total`;
            document.getElementById('modelsQueried').textContent = `${data.models_queried} models queried`;
            document.getElementById('successfulResponses').textContent =
                `${data.successful_responses}/${data.models_queried} successful`;

            // Individual responses
            const container = document.getElementById('individualResponsesContainer');
            container.innerHTML = '';

            data.individual_responses.forEach(response => {
                const div = document.createElement('div');
                div.className = 'model-response';

                const content = response.error
                    ? `<p class="error">${response.error}</p>`
                    : `<div class="response-content">${escapeHtml(response.response)}</div>`;

                div.innerHTML = `
                    <div class="model-header">
                        <span class="model-name">${response.model_name}</span>
                        <span class="model-time">⏱️ ${response.time_taken}s</span>
                    </div>
                    ${content}
                `;
                container.appendChild(div);
            });

            document.getElementById('results').classList.add('active');
        }

        function toggleIndividualResponses() {
            const container = document.getElementById('individualResponsesContainer');
            const toggleText = document.getElementById('toggleText');

            if (container.classList.contains('expanded')) {
                container.classList.remove('expanded');
                toggleText.textContent = 'Show responses';
            } else {
                container.classList.add('expanded');
                toggleText.textContent = 'Hide responses';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Allow Enter key to submit (with Shift+Enter for new line)
        document.getElementById('promptInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                submitQuery();
            }
        });
    </script>
</body>
</html>
