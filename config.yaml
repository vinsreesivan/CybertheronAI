# Multi-LLM Fusion Configuration

# List of models to query (ensure these are pulled in Ollama)
models:
  - name: "llama3.2"
    weight: 1.0
    enabled: true
  - name: "gemma2"
    weight: 1.0
    enabled: true
  - name: "qwen2.5"
    weight: 1.0
    enabled: true

# Refiner model - used to synthesize final output from all model responses
# This should be your most capable model
refiner_model: "llama3.2"

# Fusion strategy: "refiner" or "consensus"
# - refiner: Uses refiner_model to create a synthesized answer
# - consensus: Simple majority voting (works best for factual questions)
fusion_strategy: "refiner"

# Server configuration
server:
  host: "0.0.0.0"
  port: 8000
  ollama_base_url: "http://localhost:11434"

# Generation parameters
generation:
  temperature: 0.7
  max_tokens: 2000
  timeout: 60
